<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><title>Public synthetic QC validation summary</title><desc>Primary and stress-inclusive temporal detection metrics, plus logarithmic band-power error summaries for unaffected, oracle-interpolated, other corrupted and all channel-band values.</desc><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#173047}.axis{stroke:#526b7a;stroke-width:1}.grid{stroke:#dbe4e9;stroke-width:1}.small{font-size:12px}.label{font-size:14px}.title{font-size:18px;font-weight:700}.value{font-size:11px;font-weight:700}</style><text class="title" x="70" y="38">A  Temporal channel-window detection</text><text class="title" x="600" y="38">B  Band-power absolute error</text><text class="small" x="600" y="60">Logarithmic y-axis; public synthetic known-truth benchmark only</text><line class="grid" x1="70" x2="520" y1="430.0" y2="430.0"/><text class="small" x="58" y="434.0" text-anchor="end">0.0</text><line class="grid" x1="70" x2="520" y1="364.0" y2="364.0"/><text class="small" x="58" y="368.0" text-anchor="end">0.2</text><line class="grid" x1="70" x2="520" y1="298.0" y2="298.0"/><text class="small" x="58" y="302.0" text-anchor="end">0.4</text><line class="grid" x1="70" x2="520" y1="232.0" y2="232.0"/><text class="small" x="58" y="236.0" text-anchor="end">0.6</text><line class="grid" x1="70" x2="520" y1="166.0" y2="166.0"/><text class="small" x="58" y="170.0" text-anchor="end">0.8</text><line class="grid" x1="70" x2="520" y1="100.0" y2="100.0"/><text class="small" x="58" y="104.0" text-anchor="end">1.0</text><line class="axis" x1="70" x2="70" y1="100" y2="430"/><line class="axis" x1="70" x2="520" y1="430" y2="430"/><rect x="103" y="100.0" width="36" height="330.0" fill="#287a8d"/><text class="value" x="121" y="94.0" text-anchor="middle">1.000</text><rect x="151" y="100.0" width="36" height="330.0" fill="#d28b17"/><text class="value" x="169" y="94.0" text-anchor="middle">1.000</text><text class="label" x="145" y="454" text-anchor="middle">Precision</text><rect x="248" y="100.0" width="36" height="330.0" fill="#287a8d"/><text class="value" x="266" y="94.0" text-anchor="middle">1.000</text><rect x="296" y="123.6" width="36" height="306.4" fill="#d28b17"/><text class="value" x="314" y="117.6" text-anchor="middle">0.929</text><text class="label" x="290" y="454" text-anchor="middle">Recall</text><rect x="393" y="100.0" width="36" height="330.0" fill="#287a8d"/><text class="value" x="411" y="94.0" text-anchor="middle">1.000</text><rect x="441" y="112.2" width="36" height="317.8" fill="#d28b17"/><text class="value" x="459" y="106.2" text-anchor="middle">0.963</text><text class="label" x="435" y="454" text-anchor="middle">F1</text><rect x="100" y="492" width="18" height="12" fill="#287a8d"/><text class="small" x="125" y="503">Primary: 3,405 pairs; 39 positives</text><rect x="310" y="492" width="18" height="12" fill="#d28b17"/><text class="small" x="335" y="503">Stress-inclusive: 3,408 pairs; 42 positives</text><line class="grid" x1="600" x2="1030" y1="430.0" y2="430.0"/><text class="small" x="588" y="434.0" text-anchor="end">0.01</text><line class="grid" x1="600" x2="1030" y1="347.5" y2="347.5"/><text class="small" x="588" y="351.5" text-anchor="end">0.1</text><line class="grid" x1="600" x2="1030" y1="265.0" y2="265.0"/><text class="small" x="588" y="269.0" text-anchor="end">1</text><line class="grid" x1="600" x2="1030" y1="182.5" y2="182.5"/><text class="small" x="588" y="186.5" text-anchor="end">10</text><line class="grid" x1="600" x2="1030" y1="100.0" y2="100.0"/><text class="small" x="588" y="104.0" text-anchor="end">100</text><line class="axis" x1="600" x2="600" y1="100" y2="430"/><line class="axis" x1="600" x2="1030" y1="430" y2="430"/><text class="label" x="548" y="265.0" transform="rotate(-90 548 265.0)" text-anchor="middle">Absolute error (dB)</text><line x1="662" x2="662" y1="422.5" y2="335.3" stroke="#9aaab3" stroke-width="2"/