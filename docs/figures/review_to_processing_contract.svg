<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title description">
  <title id="title">Dense EEG review-to-processing contract</title>
  <desc id="description">A fail-closed workflow from exact source inputs through QC prompts, human review, ICA review and provenance-verified outputs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#375568"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#12202a" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 38px system-ui, -apple-system, sans-serif; fill: #17324d; }
      .subtitle { font: 400 20px system-ui, -apple-system, sans-serif; fill: #526b7a; }
      .step { font: 700 15px system-ui, -apple-system, sans-serif; letter-spacing: 1.4px; fill: #ffffff; }
      .box-title { font: 700 22px system-ui, -apple-system, sans-serif; fill: #17324d; }
      .box-text { font: 400 17px system-ui, -apple-system, sans-serif; fill: #304957; }
      .small { font: 500 15px system-ui, -apple-system, sans-serif; fill: #526b7a; }
      .gate { font: 700 14px system-ui, -apple-system, sans-serif; fill: #a33a36; }
      .arrow { stroke: #375568; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .human { stroke: #c78a12; stroke-width: 3; fill: #fff6dc; }
      .machine { stroke: #2f7180; stroke-width: 3; fill: #e9f5f7; }
      .artifact { stroke: #4f7b5f; stroke-width: 3; fill: #edf7ef; }
      .output { stroke: #385e87; stroke-width: 3; fill: #edf3fb; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f7f9fb"/>
  <text x="80" y="70" class="title">Dense EEG review-to-processing contract</text>
  <text x="80" y="106" class="subtitle">QC creates prompts. Complete, identity-bound human decisions unlock downstream processing.</text>

  <path d="M 370 270 H 455" class="arrow"/>
  <path d="M 755 270 H 840" class="arrow"/>
  <path d="M 1140 270 H 1225" class="arrow"/>
  <path d="M 1375 365 V 445" class="arrow"/>
  <path d="M 1225 585 H 1140" class="arrow"/>
  <path d="M 840 585 H 755" class="arrow"/>
  <path d="M 455 585 H 370" class="arrow"/>
  <path d="M 220 690 V 770" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="70" y="180" width="300" height="180" rx="16" class="machine"/>
    <rect x="70" y="180" width="72" height="34" rx="12" fill="#2f7180"/>
    <text x="89" y="203" class="step">01</text>
    <text x="95" y="248" class="box-title">Exact source inputs</text>
    <text x="95" y="284" class="box-text">Legacy BrainVision</text>
    <text x="95" y="312" class="box-text">or BIDS / EEGLAB</text>
    <text x="95" y="340" class="small">Payloads, sidecars, units, events</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="455" y="180" width="300" height="180" rx="16" class="machine"/>
    <rect x="455" y="180" width="72" height="34" rx="12" fill="#2f7180"/>
    <text x="474" y="203" class="step">02</text>
    <text x="480" y="248" class="box-title">Fail-closed inventory</text>
    <text x="480" y="284" class="box-text">Metadata and event alignment</text>
    <text x="480" y="312" class="box-text">Reference and geometry gates</text>
    <text x="480" y="340" class="small">No preprocessing authorization</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="840" y="180" width="300" height="180" rx="16" class="machine"/>
    <rect x="840" y="180" width="72" height="34" rx="12" fill="#2f7180"/>
    <text x="859" y="203" class="step">03</text>
    <text x="865" y="248" class="box-title">Full-recording QC</text>
    <text x="865" y="284" class="box-text">Channel and interval prompts</text>
    <text x="865" y="312" class="box-text">Trace, neighbour and PSD evidence</text>
    <text x="865" y="340" class="small">Automatic decisions = 0</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1225" y="180" width="300" height="180" rx="16" class="human"/>
    <rect x="1225" y="180" width="72" height="34" rx="12" fill="#c78a12"/>
    <text x="1244" y="203" class="step">04</text>
    <text x="1250" y="248" class="box-title">Human review</text>
    <text x="1250" y="284" class="box-text">Keep or interpolate channel</text>
    <text x="1250" y="312" class="box-text">Keep or refine interval</text>
    <text x="1250" y="340" class="small">Evidence, rationale, reviewer, date</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1225" y="445" width="300" height="190" rx="16" class="artifact"/>
    <rect x="1225" y="445" width="72" height="34" rx="12" fill="#4f7b5f"/>
    <text x="1244" y="468" class="step">05</text>
    <text x="1250" y="513" class="box-title">Immutable decision bundle</text>
    <text x="1250" y="549" class="box-text">Complete prompt coverage</text>
    <text x="1250" y="577" class="box-text">Exact QC and source binding</text>
    <text x="1250" y="605" class="small">Only this artifact unlocks ICA</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="840" y="495" width="300" height="190" rx="16" class="machine"/>
    <rect x="840" y="495" width="72" height="34" rx="12" fill="#2f7180"/>
    <text x="859" y="518" class="step">06</text>
    <text x="865" y="563" class="box-title">Guarded ICA review</text>
    <text x="865" y="599" class="box-text">Reviewed intervals omitted</text>
    <text x="865" y="627" class="box-text">Every component visualized</text>
    <text x="865" y="655" class="small">No component removed automatically</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="455" y="495" width="300" height="190" rx="16" class="human"/>
    <rect x="455" y="495" width="72" height="34" rx="12" fill="#c78a12"/>
    <text x="474" y="518" class="step">07</text>
    <text x="480" y="563" class="box-title">Component decisions</text>
    <text x="480" y="599" class="box-text">Keep or exclude every component</text>
    <text x="480" y="627" class="box-text">Solution-bound evidence</text>
    <text x="480" y="655" class="small">Second immutable decision gate</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="495" width="300" height="195" rx="16" class="machine"/>
    <rect x="70" y="495" width="72" height="34" rx="12" fill="#2f7180"/>
    <text x="89" y="518" class="step">08</text>
    <text x="95" y="563" class="box-title">Reviewed application</text>
    <text x="95" y="599" class="box-text">Apply ICA exclusions</text>
    <text x="95" y="627" class="box-text">Interpolate, rereference, epoch</text>
    <text x="95" y="655" class="small">Retain event and drop lineage</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="770" width="620" height="130" rx="16" class="output"/>
    <text x="100" y="818" class="box-title">Verified outputs and bounded results</text>
    <text x="100" y="852" class="box-text">Exact recursive output set · upstream identities · runtime · decision lineage</text>
    <text x="100" y="880" class="small">Deterministic under the pinned runtime; not proof that EEG is clean</text>
  </g>

  <rect x="775" y="765" width="750" height="140" rx="16" fill="#fff0ef" stroke="#b54747" stroke-width="2"/>
  <text x="805" y="808" class="gate">FAIL-CLOSED AT EVERY TRANSITION</text>
  <text x="805" y="842" class="box-text">Stop if source, configuration, prompt package, decision bundle,</text>
  <text x="805" y="870" class="box-text">ICA solution, executable source or runtime identity changes.</text>
</svg>
